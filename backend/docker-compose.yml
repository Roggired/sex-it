version: '3'
services:
  database:
    container_name: sexit-postgres
    image: postgres:latest
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./config/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      sexit-network:
        ipv4_address: 172.28.0.2

  keycloak:
    container_name: sexit-keycloak
    image: bitnami/keycloak:latest
    depends_on:
      - database
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_DATABASE_HOST: database
      KEYCLOAK_DATABASE_NAME: keycloak
      KEYCLOAK_DATABASE_USER: keycloak
      KEYCLOAK_DATABASE_PASSWORD: keycloak
      KEYCLOAK_DATABASE_SCHEMA: public
#       Based on https://hub.docker.com/r/bitnami/keycloak/ KEYCLOAK_EXTRA_ARGS is used to define additional arguments
#       for kc.sh. We use --import-realm based on https://www.keycloak.org/server/importExport (22.0.1) to enable
#       import realm on startup feature. This feature allow us to keep recreating docker containers as simple as possible
      KEYCLOAK_EXTRA_ARGS: --import-realm
    volumes:
#       it is important to use /opt/bitnami/keycloak/data/import dir, because Keycloak uses <KEYCLOAK_HOME_DIR>/data/import
#       directory to find json files with realms on importing realms on startup.
#       (Have read about this here: https://stackoverflow.com/a/72262610)
      - ./config/sexit-realm.json:/opt/bitnami/keycloak/data/import/sexit-realm.json
    networks:
      sexit-network:
        ipv4_address: 172.28.0.3

  maildev:
    container_name: sexit-maildev
    image: maildev/maildev
    networks:
      sexit-network:
        ipv4_address: 172.28.0.4

  platform:
    build: services/platform
    container_name: sexit-platform
    depends_on:
      - database
    networks:
      sexit-network:
        ipv4_address: 172.28.0.6

#  bbb:
#    image: bigbluebutton/greenlight
#    container_name: sexit-bbb
#    networks:
#      sexit-network:
#        ipv4_address: 172.28.0.7

networks:
  sexit-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
